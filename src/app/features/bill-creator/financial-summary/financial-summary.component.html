<aside class="summary">
  <h2>Summary</h2>

  <dl class="summary__list">
    <div>
      <dt>Plot Amount</dt>
      <dd>{{ totalPlotAmount() | inr }}</dd>
    </div>
    <div>
      <dt>Received</dt>
      <dd>{{ totalReceived() | inr }}</dd>
    </div>
    <div class="summary__outstanding">
      <dt>Balance</dt>
      <dd>{{ totalBalance() | inr }}</dd>
    </div>
  </dl>
</aside>
