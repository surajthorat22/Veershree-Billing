<div class="page">
  <header class="page__header">
    <div>
      <h1>Create Bill</h1>
      <p>Fill details → add payments → preview</p>
    </div>
    <div class="page__actions">
      <button type="button" class="btn btn--ghost" (click)="loadSample()">Sample</button>
      <button type="button" class="btn btn--ghost" (click)="clearDraft()">Clear</button>
      <button type="button" class="btn btn--primary" (click)="preview()">Preview</button>
    </div>
  </header>

  <form [formGroup]="form" (ngSubmit)="preview()" novalidate>
    <div class="layout-bar">
      <label class="field layout-field">
        <span>Layout</span>
        <select formControlName="layoutId">
          @for (layout of layouts; track layout.id) {
            <option [value]="layout.id">{{ layout.name }}</option>
          }
        </select>
      </label>
    </div>

    @if (submitted() && form.invalid) {
      <p class="banner" role="alert">Please fill the required fields.</p>
    }

    <div class="layout">
      <app-bill-information [form]="form" [submitted]="submitted()" />
      <app-financial-summary
        [totalPlotAmount]="totalPlotAmount()"
        [totalReceived]="totalReceived()"
        [totalBalance]="totalBalance()"
        [totalScheduled]="totalScheduled()"
      />
    </div>

    <app-payment-list [form]="form" [submitted]="submitted()" />
    <app-payment-schedule [form]="form" [submitted]="submitted()" />
    <app-conditions-editor [form]="form" />

    <div class="page__footer">
      <button type="submit" class="btn btn--primary btn--large">Preview Bill</button>
    </div>
  </form>
</div>
