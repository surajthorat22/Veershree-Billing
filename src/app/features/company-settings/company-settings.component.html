<div class="page">
  <header class="page__header">
    <div>
      <h1>Document Settings</h1>
      <p>
        These details appear on every generated bill. Upload the logo, stamp and signature once.
      </p>
    </div>
    <a routerLink="/create" class="btn btn--primary">Back to Create Bill</a>
  </header>

  <form class="settings" (submit)="$event.preventDefault()">
    <section class="card">
      <div class="card__header">
        <h2>Company details</h2>
      </div>
      <div class="grid">
        <label class="field">
          <span>Company Name</span>
          <input [ngModel]="company().name" (ngModelChange)="update('name', $event)" name="name" />
        </label>
        <label class="field">
          <span>Tagline</span>
          <input
            [ngModel]="company().tagline"
            (ngModelChange)="update('tagline', $event)"
            name="tagline"
          />
        </label>
        <label class="field field--wide">
          <span>Address</span>
          <textarea
            rows="2"
            [ngModel]="company().address"
            (ngModelChange)="update('address', $event)"
            name="address"
          ></textarea>
        </label>
        <label class="field">
          <span>Contact Number</span>
          <input
            [ngModel]="company().contact"
            (ngModelChange)="update('contact', $event)"
            name="contact"
          />
        </label>
        <label class="field">
          <span>Email</span>
          <input
            type="email"
            [ngModel]="company().email"
            (ngModelChange)="update('email', $event)"
            name="email"
          />
        </label>
        <label class="field">
          <span>Authorized Person Name</span>
          <input
            [ngModel]="company().authorizedPerson"
            (ngModelChange)="update('authorizedPerson', $event)"
            name="authorizedPerson"
          />
        </label>
        <label class="field">
          <span>Designation</span>
          <input
            [ngModel]="company().designation"
            (ngModelChange)="update('designation', $event)"
            name="designation"
          />
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card__header">
        <h2>Logo, stamp and signature</h2>
        <p>These images are reused automatically on every bill.</p>
      </div>
      <div class="uploads">
        <app-image-upload
          label="Logo"
          hint="Appears in the document header."
          [image]="company().logo"
          (imageChange)="update('logo', $event)"
        />
        <app-image-upload
          label="Stamp"
          hint="Appears in the signature area."
          [image]="company().stamp"
          (imageChange)="update('stamp', $event)"
        />
        <app-image-upload
          label="Authorized Signature"
          hint="Appears above the authorized person name."
          [image]="company().signature"
          (imageChange)="update('signature', $event)"
        />
      </div>
    </section>
  </form>
</div>
